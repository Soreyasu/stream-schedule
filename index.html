<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective Bureau - Modern Intelligence Roster</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-void: #090a0d;
            --surface-glass: rgba(18, 22, 31, 0.7);
            --surface-glass-hover: rgba(26, 32, 45, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(220, 175, 75, 0.35);
            --text-primary: #f0f3f8;
            --text-muted: #8b95a5;
            --gold-accent: #d4af37;

            --status-rest-bg: rgba(75, 85, 99, 0.15);
            --status-rest-text: #9ca3af;
            --status-rest-border: rgba(156, 163, 175, 0.25);

            --status-active-bg: rgba(239, 68, 68, 0.12);
            --status-active-text: #f87171;
            --status-active-border: rgba(239, 68, 68, 0.35);

            --status-case-bg: rgba(59, 130, 246, 0.12);
            --status-case-text: #60a5fa;
            --status-case-border: rgba(59, 130, 246, 0.35);

            --status-special-bg: rgba(234, 179, 8, 0.12);
            --status-special-text: #facc15;
            --status-special-border: rgba(234, 179, 8, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-void);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: clamp(12px, 2vw, 25px);
            color: var(--text-primary);
            overflow-x: hidden;
            overflow-y: auto;
        }

        .schedule-canvas {
            width: 100%;
            max-width: 1800px;
            min-height: auto;
            background:
                radial-gradient(ellipse at 80% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(30, 58, 138, 0.12) 0%, transparent 50%),
                #0c0f14;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 30px 75px -15px rgba(0, 0, 0, 0.9), 0 0 1px 1px rgba(255, 255, 255, 0.05);
            padding: clamp(20px, 3vw, 55px) clamp(16px, 3.5vw, 70px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 24px;
            position: relative;
            width: 100%;
        }

        .header-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            margin-left: auto;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 175px;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-accent), transparent);
        }

        .title-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .main-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(26px, 2.4vw, 45px);
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .main-title span {
            color: var(--gold-accent);
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            padding: 8px 18px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            max-width: 100%;
        }

        .date-badge .label {
            font-size: clamp(14px, 1.2vw, 21px);
            font-weight: 700;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .date-badge .range {
            font-size: clamp(15px, 1.3vw, 23px);
            font-weight: 500;
            color: #d1d5db;
        }

        .sub-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(14px, 1.1vw, 19px);
            color: var(--text-muted);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub-title::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .twitch-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(145, 71, 255, 0.12);
            color: #cbb4ff;
            border: 1px solid rgba(145, 71, 255, 0.35);
            padding: 10px 20px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(13px, 1vw, 15px);
            font-weight: 700;
            letter-spacing: 1.2px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .twitch-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .twitch-btn:hover {
            background: #9146ff;
            color: #ffffff;
            border-color: #9146ff;
            box-shadow: 0 0 25px rgba(145, 71, 255, 0.4);
            transform: translateY(-2px);
        }

        .shelving-unit {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .shelf-row {
            flex-shrink: 0;
            min-height: 96px;
            display: grid;
            grid-template-columns: minmax(130px, 190px) minmax(190px, 260px) minmax(0, 1fr) auto;
            align-items: center;
            position: relative;
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            padding: 14px clamp(14px, 1.8vw, 30px);
            transition: all 0.25s ease;
        }

        .shelf-row:hover {
            background: var(--surface-glass-hover);
            border-color: var(--border-highlight);
            transform: translateX(4px);
        }

        .shelf-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 4px;
            background: transparent;
            border-radius: 0 4px 4px 0;
            transition: background 0.25s ease;
        }

        .shelf-row:hover::before {
            background: var(--gold-accent);
            box-shadow: 0 0 12px var(--gold-accent);
        }

        .shelf-row.is-today {
            background: rgba(32, 40, 58, 0.95);
            border-color: var(--gold-accent);
            box-shadow:
                0 0 25px rgba(212, 175, 55, 0.15),
                inset 0 0 15px rgba(212, 175, 55, 0.08);
            transform: translateX(6px);
        }

        .shelf-row.is-today::before {
            background: var(--gold-accent);
            box-shadow: 0 0 15px var(--gold-accent);
        }

        .shelf-row.is-today .day-slot {
            color: var(--gold-accent);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
        }

        .day-slot {
            font-family: 'Syne', sans-serif;
            font-size: clamp(17px, 1.3vw, 24px);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.6px;
            padding-right: 12px;
            white-space: nowrap;
        }

        .time-slot {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(13px, 0.95vw, 16px);
            font-weight: 500;
            color: var(--gold-accent);
            padding: 0 clamp(10px, 1vw, 18px);
            border-left: 1px solid var(--border-subtle);
            white-space: nowrap;
        }

        .activity-slot {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 clamp(12px, 1.2vw, 24px);
            border-left: 1px solid var(--border-subtle);
            min-width: 0; /* Critical: allows long titles to wrap or truncate instead of expanding parent */
        }

        .case-title {
            font-size: clamp(17px, 1.25vw, 23px);
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.2px;
            line-height: 1.25;
            word-break: break-word;
        }

        .case-details {
            font-size: clamp(13px, 0.95vw, 16px);
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.3;
            word-break: break-word;
        }

        .status-slot {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-left: clamp(12px, 1.2vw, 24px);
            border-left: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .seal-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(11px, 0.8vw, 13px);
            font-weight: 700;
            width: clamp(160px, 11vw, 200px);
            height: clamp(40px, 2.6vw, 46px);
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 8px;
            display: flex;
            text-align: center;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 0 8px;
            white-space: nowrap;
        }

        .seal-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-rest {
            background: var(--status-rest-bg);
            color: var(--status-rest-text);
            border: 1px solid var(--status-rest-border);
        }
        .status-rest::before { background: var(--status-rest-text); }

        .status-active {
            background: var(--status-active-bg);
            color: var(--status-active-text);
            border: 1px solid var(--status-active-border);
        }
        .status-active::before { background: var(--status-active-text); box-shadow: 0 0 8px var(--status-active-text); }

        .status-investigation {
            background: var(--status-case-bg);
            color: var(--status-case-text);
            border: 1px solid var(--status-case-border);
        }
        .status-investigation::before { background: var(--status-case-text); box-shadow: 0 0 8px var(--status-case-text); }

        .status-special {
            background: var(--status-special-bg);
            color: var(--status-special-text);
            border: 1px solid var(--status-special-border);
        }
        .status-special::before { background: var(--status-special-text); box-shadow: 0 0 8px var(--status-special-text); }

        /* Tablet scaling: keeps rows clean without spilling over */
        @media (max-width: 1280px) {
            .shelf-row {
                grid-template-columns: 120px 170px minmax(0, 1fr) auto;
                padding: 12px 16px;
            }
            .day-slot { font-size: 18px; }
            .time-slot { font-size: 13px; }
            .case-title { font-size: 18px; }
            .seal-badge { width: 160px; height: 38px; font-size: 11px; }
        }

        /* Mobile card reflow */
        @media (max-width: 980px) {
            body {
                padding: 10px;
            }

            .schedule-canvas {
                min-height: auto;
                padding: 20px 14px;
            }

            .title-group {
                align-items: flex-start;
                width: 100%;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .header-actions {
                align-items: flex-start;
                margin-left: 0;
                width: 100%;
            }

            .twitch-btn {
                width: 100%;
                justify-content: center;
            }

            .shelf-row {
                grid-template-columns: 1fr auto;
                grid-template-areas:
                    "day time"
                    "activity activity"
                    "badge badge";
                gap: 12px;
                padding: 16px;
                min-height: auto;
            }

            .shelf-row:hover {
                transform: none;
            }

            .shelf-row.is-today {
                transform: none;
            }

            .day-slot {
                grid-area: day;
                padding-right: 0;
            }

            .time-slot {
                grid-area: time;
                text-align: right;
                border-left: none;
                padding: 0;
            }

            .activity-slot {
                grid-area: activity;
                border-left: none;
                border-top: 1px solid var(--border-subtle);
                border-bottom: 1px solid var(--border-subtle);
                padding: 10px 0;
            }

            .status-slot {
                grid-area: badge;
                border-left: none;
                padding-left: 0;
                width: 100%;
            }

            .seal-badge {
                width: 100%;
                height: 44px;
            }
        }
    </style>
</head>

<body>
    <div class="schedule-canvas">
        <header class="header">
            <div class="title-group">
                <h1 class="main-title">BUREAU DISPATCH <span>//</span> ROSTER</h1>
                <div class="date-badge">
                    <span class="label">Docket</span>
                    <span class="range" id="schedule-date-range">Sept 7 — Sept 13, 2026</span>
                </div>
            </div>

            <div class="header-actions">
                <div class="sub-title">Active Investigative Feed</div>

                <a href="https://twitch.tv/Soreyasu" target="_blank" rel="noopener noreferrer" class="twitch-btn">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z" />
                    </svg>
                    <span>Twitch Live</span>
                </a>
            </div>
        </header>

        <main class="shelving-unit" id="schedule-container"></main>
    </div>

    <script>
        const currentWeekRange = "Sept 7 — Sept 13, 2026";
        document.getElementById("schedule-date-range").textContent = currentWeekRange;

        // Base timezone of your broadcast
        const BASE_TIMEZONE = "Europe/Brussels";

        const scheduleData = [
            {
                day: "MONDAY",
                start: null,
                end: null,
                title: "Archive Bureau Resupply",
                subtitle: "Office Closed • Offline",
                status: "REST DAY"
            },
            {
                day: "TUESDAY",
                start: null,
                end: null,
                title: "Archive Bureau Resupply",
                subtitle: "Office Closed • Offline",
                status: "REST DAY"
            },
            {
                day: "WEDNESDAY",
                start: null,
                end: null,
                title: "Archive Bureau Resupply",
                subtitle: "Office Closed • Offline",
                status: "REST DAY"
            },
            {
                day: "THURSDAY",
                start: "19:00",
                end: "22:00",
                title: "Final Fantasy X-2",
                subtitle: "Blind Playthrough • Preparation for speedrunning",
                status: "INVESTIGATION"
            },
            {
                day: "FRIDAY",
                start: "19:00",
                end: "22:00",
                title: "Final Fantasy X-2",
                subtitle: "Blind Playthrough • Preparation for speedrunning",
                status: "OPEN CASE"
            },
            {
                day: "SATURDAY",
                start: "19:00",
                end: "22:00",
                title: "Castlevania: Aria of Sorrow",
                subtitle: "Speedrun Glitchless Soma • Practicing & Runs",
                status: "LABORATORY"
            },
            {
                day: "SUNDAY",
                start: null,
                end: null,
                title: "Weekly Debriefing & Maintenance",
                subtitle: "Docket Prep for Next Cycle",
                status: "REST DAY"
            }
        ];

        function convertBroadcastTimeToLocal(timeStr) {
            if (!timeStr) return null;

            const [targetHours, targetMinutes] = timeStr.split(":").map(Number);
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");

            const initialUtc = new Date(`${year}-${month}-${day}T${String(targetHours).padStart(2, "0")}:${String(targetMinutes).padStart(2, "0")}:00Z`);

            const formatter = new Intl.DateTimeFormat("en-US", {
                timeZone: BASE_TIMEZONE,
                hour: "numeric",
                minute: "numeric",
                hour12: false
            });

            const parts = formatter.formatToParts(initialUtc);
            const currentBroadcastHour = parseInt(parts.find(p => p.type === "hour").value, 10) % 24;
            const currentBroadcastMin = parseInt(parts.find(p => p.type === "minute").value, 10);

            const diffMinutes = ((currentBroadcastHour * 60) + currentBroadcastMin) - ((targetHours * 60) + targetMinutes);
            const actualStreamDateUtc = new Date(initialUtc.getTime() - (diffMinutes * 60 * 1000));

            const localTimeStr = new Intl.DateTimeFormat(navigator.language || "en-US", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }).format(actualStreamDateUtc);

            const tzName = new Intl.DateTimeFormat(navigator.language || "en-US", {
                timeZoneName: "short"
            }).formatToParts(actualStreamDateUtc).find(p => p.type === "timeZoneName")?.value || "";

            return {
                time: localTimeStr,
                tz: tzName
            };
        }

        function formatLocalTimeRange(startStr, endStr) {
            if (!startStr || !endStr) return "— — —";

            const startObj = convertBroadcastTimeToLocal(startStr);
            const endObj = convertBroadcastTimeToLocal(endStr);

            return `${startObj.time} – ${endObj.time} ${startObj.tz}`.trim();
        }

        function resolveStatusClass(statusText) {
            const text = statusText.toUpperCase();
            if (text.includes("REST") || text.includes("OFFLINE") || text.includes("CLOSED")) {
                return "status-rest";
            }
            if (text.includes("PATROL") || text.includes("TACTICAL") || text.includes("LIVE") || text.includes("ASSIGNED")) {
                return "status-active";
            }
            if (text.includes("CASE") || text.includes("LAB") || text.includes("INVESTIGATION")) {
                return "status-investigation";
            }
            if (text.includes("SPECIAL") || text.includes("EVENT") || text.includes("PUBLIC") || text.includes("DUEL")) {
                return "status-special";
            }
            return "status-active";
        }

        function renderSchedule() {
            const container = document.getElementById("schedule-container");
            if (!container) return;

            const dayMap = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
            const currentDayName = dayMap[new Date().getDay()];

            container.innerHTML = scheduleData.map(item => {
                const badgeClass = resolveStatusClass(item.status);
                const localTime = formatLocalTimeRange(item.start, item.end);
                const isRest = badgeClass === "status-rest";
                const isToday = item.day.toUpperCase() === currentDayName;

                return `
                    <div class="shelf-row ${isToday ? 'is-today' : ''}" style="${isRest && !isToday ? 'opacity: 0.6;' : ''}">
                        <div class="day-slot">${item.day}</div>
                        <div class="time-slot">${localTime}</div>
                        <div class="activity-slot">
                            <div class="case-title">${item.title}</div>
                            <div class="case-details">${item.subtitle}</div>
                        </div>
                        <div class="status-slot">
                            <span class="seal-badge ${badgeClass}">${item.status}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderSchedule();
    </script>
</body>

</html>
